[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ISOWmodelling"
version = "1.1"
description = "Hybrid model to reconstruct ISOW intensity over the last 800 ka"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Nathan Stevenard" }]
dependencies = [
  "pandas~=2.2.2",
  "numpy~=1.25.2",
  "shap~=0.47.0",
  "tqdm~=4.66.5",
  "xgboost~=2.1.4",
  "scikit-learn~=1.5.1",
  "matplotlib~=3.10.1",
  "seaborn~=0.13.2",
  "optuna~=4.2.1",
  "scipy~=1.12.0",
]

[tool.setuptools]
packages = ["isow"]

[project.urls]
Homepage = "https://github.com/NathStevenard/ISOWmodelling"
Issues = "https://github.com/NathStevenard/ISOWmodelling/issues"
